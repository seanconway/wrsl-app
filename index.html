  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Declares that this page supplies its own dark palette. Without it,
         Chrome's auto-dark-mode repaints the scoreboard: observed on a stock
         profile flattening every surface to rgb(24,26,27) and every colour to
         one off-white, which takes the athlete red and green with it. Those two
         are fixed by the ruleset and identify the corners, so a browser
         deciding to adjust them is a correctness problem, not a taste one. -->
    <meta name="color-scheme" content="dark" />
    <title>RefRemote Scoreboard</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
