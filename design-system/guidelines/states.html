<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.r{display:flex;gap:12px;align-items:center}.b{font-family:var(--font-ui);font-size:14px;font-weight:600;padding:10px 16px;border-radius:5px;background:var(--lime-500);color:var(--ink-900);border:none}.h{font-family:var(--font-mono);font-size:9px;color:var(--ink-400);margin-top:5px;text-align:center}.c{display:flex;flex-direction:column}</style></head><body><div class="w"><div class="r"><div class="c"><button class="b" style="">Start match</button><div class="h">Default</div></div><div class="c"><button class="b" style="filter:brightness(.93)">Start match</button><div class="h">Hover</div></div><div class="c"><button class="b" style="filter:brightness(.88);transform:scale(.98)">Start match</button><div class="h">Press</div></div><div class="c"><button class="b" style="box-shadow:var(--glow-focus)">Start match</button><div class="h">Focus</div></div><div class="c"><button class="b" style="opacity:.38">Start match</button><div class="h">Disabled</div></div></div></div></body></html>
