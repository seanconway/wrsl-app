<!-- @dsCard group="Colors" viewport="700x170" name="Mat vs Paper" subtitle="Same tokens, two modes. .rr-mat re-points every semantic alias." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}.p{padding:14px;border:1px solid var(--border-hairline);background:var(--surface-card)}.k{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}.v{font-size:21px;font-weight:700;color:var(--text-strong);margin-top:4px}.m{font-size:12px;color:var(--text-body);margin-top:8px}.chip{display:inline-block;margin-top:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.06em}</style></head><body><div class="w"><div class="g"><div class="p"><div class="k">Paper · default</div><div class="v">Console &amp; web</div><div class="m">White cards, hairline borders, low shadow.</div><span class="chip">PRIMARY</span></div><div class="p rr-mat" style="border-radius:0"><div class="k">Mat · .rr-mat</div><div class="v">Scoreboard &amp; handset</div><div class="m">No shadows. Depth from ink steps + hairlines.</div><span class="chip">LIVE</span></div></div></div></body></html>
