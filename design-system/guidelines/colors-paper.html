<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.row{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px}.lb{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em}.cap{display:flex;gap:0;margin-top:6px}.cap div{flex:1;font-family:var(--font-mono);font-size:9px;color:var(--ink-400);padding-left:6px}.sw{height:76px;border:1px solid var(--alpha-hairline-light)}</style></head><body><div class="w"><div class="row" style="gap:12px"><div class="sw" style="background:#FAFAF7"><span class="lb" style="color:#0B0D0C">--paper #FAFAF7</span></div><div class="sw" style="background:#FFFFFF"><span class="lb" style="color:#0B0D0C">--paper-raised #FFFFFF</span></div><div class="sw" style="background:#F1F1EC"><span class="lb" style="color:#0B0D0C">--paper-sunken #F1F1EC</span></div><div class="sw" style="background:#0B0D0C"><span class="lb" style="color:#fff">--surface-inverse #0B0D0C</span></div></div></div></body></html>
