<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.r{display:flex;gap:22px;align-items:center;flex-wrap:wrap;color:var(--ink-900)}.h{font-family:var(--font-mono);font-size:9px;color:var(--ink-400);margin-top:14px}</style>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script></head><body><div class="w"><div class="r" id="icons"></div><div class="h">Inline SVG, currentColor · 16 / 20 / 24 / 32px only · no emoji, ever</div></div>
<script>const N=["play","pause","square","rotate-ccw","plus","minus","flag","chevrons-up","timer","radio","battery","wifi-off","users","grid-3x3","git-fork","settings","alert-triangle","circle-dot","monitor","printer"];const A={'alert-triangle':'TriangleAlert'};const P=n=>n.split('-').map(p=>p[0].toUpperCase()+p.slice(1)).join('');
document.getElementById('icons').innerHTML=N.map(n=>{const d=lucide.icons[A[n]]||lucide.icons[P(n)];const inner=(d[2]||[]).map(([t,a])=>'<'+t+' '+Object.keys(a).map(k=>k+'="'+a[k]+'"').join(' ')+'/>').join('');return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';}).join('');</script></body></html>
