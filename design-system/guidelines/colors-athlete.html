<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.b{height:88px;display:flex;flex-direction:column;justify-content:space-between;padding:8px}.n{font-family:var(--font-plate);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase}.h{font-family:var(--font-mono);font-size:9px;opacity:.75}</style></head><body><div class="w"><div class="g"><div class="b" style="background:#E03127;color:#fff"><span class="n">Red corner</span><span class="h">--athlete-red #E03127</span></div><div class="b" style="background:#12A150;color:#fff"><span class="n">Green corner</span><span class="h">--athlete-green #12A150</span></div><div class="b" style="background:#fff;color:#0B0D0C;border:1px solid var(--athlete-white-line)"><span class="n">White gi</span><span class="h">--athlete-white #FFFFFF</span></div></div></div></body></html>
