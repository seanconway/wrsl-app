<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.c{border:1px solid var(--alpha-hairline-light);background:#fff;padding:10px}.d{font-family:var(--font-mono);font-size:21px;font-weight:700;color:var(--ink-900)}.n{font-size:12px;color:var(--ink-500);margin-top:4px}.h{font-family:var(--font-mono);font-size:9px;color:var(--ink-400);margin-top:12px}</style></head><body><div class="w"><div class="g"><div class="c"><div class="d">90ms</div><div class="n">Press feedback</div></div><div class="c"><div class="d">140ms</div><div class="n">Hover · toggles · score flash</div></div><div class="c"><div class="d">220ms</div><div class="n">Sheets · tabs</div></div><div class="c"><div class="d">380ms</div><div class="n">Page level only</div></div></div><div class="h">--ease-out cubic-bezier(.2,.8,.2,1) · --ease-snap cubic-bezier(.9,0,.1,1) · the live clock never animates</div></div></body></html>
