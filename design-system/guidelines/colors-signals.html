<!-- @dsCard group="Colors" viewport="700x150" name="Signals" subtitle="Go is lime, not green — green belongs to the corner. Colour never carries state alone." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--paper);font-family:var(--font-ui)}.w{padding:20px 24px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.s{border:1px solid var(--alpha-hairline-light);background:#fff;padding:10px}.d{width:12px;height:12px;border-radius:999px;margin-bottom:26px}.t{font-size:13px;font-weight:600;color:var(--ink-900)}.h{font-family:var(--font-mono);font-size:9px;color:var(--ink-400)}</style></head><body><div class="w"><div class="g"><div class="s"><div class="d" style="background:#C2F000"></div><div class="t">Running · valid</div><div class="h">--signal-go #C2F000</div></div><div class="s"><div class="d" style="background:#F5A300"></div><div class="t">Penalty · low battery</div><div class="h">--signal-warn #F5A300</div></div><div class="s"><div class="d" style="background:#E03127"></div><div class="t">Stopped · DQ</div><div class="h">--signal-stop #E03127</div></div><div class="s"><div class="d" style="background:#1B5CD8"></div><div class="t">Informational</div><div class="h">--signal-info #1B5CD8</div></div></div></div></body></html>
